# Gradle daemon settings for a Kotlin Multiplatform build.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g

# AndroidX is required by Compose Multiplatform.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Skip iOS targets on non-macOS hosts instead of failing configuration.
kotlin.native.ignoreDisabledTargets=true
